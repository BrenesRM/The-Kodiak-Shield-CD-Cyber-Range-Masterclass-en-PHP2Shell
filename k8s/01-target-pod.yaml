apiVersion: v1
kind: ConfigMap
metadata:
  name: php-target-config
  namespace: php2shell-sandbox
data:
  php.ini: |
    [PHP]
    engine = On
    short_open_tag = Off
    precision = 14
    output_buffering = 4096
    zlib.output_compression = Off
    implicit_flush = Off
    max_execution_time = 30
    max_input_time = 60
    memory_limit = 128M
    error_reporting = E_ALL
    display_errors = On
    display_startup_errors = On
    log_errors = On
    log_errors_max_len = 1024
    ignore_repeated_errors = Off
    ignore_repeated_source = Off
    report_memleaks = On
    post_max_size = 256M
    upload_max_filesize = 256M
    
    [Session]
    session.save_handler = files
    session.use_strict_mode = 0
    session.use_cookies = 1
    session.use_only_cookies = 1
    session.name = PHPSESSID
    session.auto_start = 0
    session.upload_progress.enabled = 1
    session.upload_progress.cleanup = 1
    session.upload_progress.prefix = "upload_progress_"
    session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
    session.upload_progress.freq = "1%"
    session.upload_progress.min_freq = "1"

  index.php: |
    <?php
    header('Content-Type: application/json; charset=utf-8');
    $response = [
        'status' => 'online',
        'service' => 'PHP2Shell Vulnerable Sandbox Target',
        'php_version' => PHP_VERSION,
        'sapi' => php_sapi_name(),
        'memory_limit' => ini_get('memory_limit'),
        'post_max_size' => ini_get('post_max_size'),
        'session_upload_progress' => ini_get('session.upload_progress.enabled'),
        'current_memory_usage' => memory_get_usage(true),
        'server_time' => date('Y-m-d H:i:s'),
        'request_method' => $_SERVER['REQUEST_METHOD'] ?? 'UNKNOWN',
        'content_type' => $_SERVER['CONTENT_TYPE'] ?? 'none'
    ];
    echo json_encode($response, JSON_PRETTY_PRINT);
    ?>

  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;
        client_max_body_size 300M;

        server {
            listen 80;
            server_name localhost;
            root /var/www/html;
            index index.php index.html;

            location / {
                try_files $uri $uri/ /index.php?$query_string;
            }

            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
                fastcgi_param PATH_INFO $fastcgi_path_info;
                fastcgi_read_timeout 60s;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-php
  namespace: php2shell-sandbox
  labels:
    app: vulnerable-php
    role: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-php
  template:
    metadata:
      labels:
        app: vulnerable-php
        role: target
    spec:
      containers:
        # Contenedor PHP-FPM con la versión vulnerable previa al parche (Slide 9 del PDF)
        - name: php-fpm
          image: php:8.4.26-fpm
          ports:
            - containerPort: 9000
              name: fastcgi
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          volumeMounts:
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/custom.ini
              subPath: php.ini
            - name: web-root
              mountPath: /var/www/html/index.php
              subPath: index.php
        
        # Contenedor NGINX Reverse Proxy sirviendo FastCGI en pod localhost
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: web-root
              mountPath: /var/www/html/index.php
              subPath: index.php

      volumes:
        - name: php-config
          configMap:
            name: php-target-config
        - name: nginx-config
          configMap:
            name: php-target-config
        - name: web-root
          configMap:
            name: php-target-config
---
# Servicio interno del clúster (ClusterIP) - Sin exposición externa por seguridad (Slide 9)
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-php
  namespace: php2shell-sandbox
  labels:
    app: vulnerable-php
spec:
  type: ClusterIP
  selector:
    app: vulnerable-php
  ports:
    - name: http
      port: 80
      targetPort: 80
