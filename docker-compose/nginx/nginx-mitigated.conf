server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 300M;

    # [BLUE TEAM MITIGATION - Slide 13 del PDF]
    # Táctica: Rechazar el vector de ataque en la puerta perimetral.
    # Regla: Devolver error 403 Forbidden a cualquier petición con multipart/form-data.
    if ($http_content_type ~* "multipart/form-data") {
        return 403 "Blocked: multipart/form-data prohibited by Blue Team mitigation rule.\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass target-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }
}
