[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
max_execution_time = 30
max_input_time = 60

# [BLUE TEAM MITIGATION - CVE-2026-109618]
# Elimina el límite artificial de memoria para mitigar la condición predecible de OOM en parseo
memory_limit = -1

error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
post_max_size = 256M
upload_max_filesize = 256M

[Session]
session.save_handler = files
session.use_cookies = 1
session.name = PHPSESSID
session.auto_start = 0

# [BLUE TEAM MITIGATION - CVE-2026-109619]
# Deshabilita el upload_progress para evitar la reutilización de punteros obsoletos en procesos reciclados
session.upload_progress.enabled = 0
